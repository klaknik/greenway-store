name: Auto Update Greenway Prices & Descriptions

on:
  schedule:
    # 03:00 и 15:00 UTC = 06:00 и 18:00 по Московскому времени (UTC+3)
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Позволяет запускать проверку вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run price updater script
        run: python update_prices.py

      - name: Commit and push if products.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          # Проверяем наличие изменений перед коммитом, чтобы не падать с ошибкой, если цены не менялись
          if git diff --staged --quiet; then
            echo "Изменений в products.json нет. Коммит не требуется."
          else
            git commit -m "Автообновление цен и описаний Greenway [skip ci]"
            git push
            echo "Файл products.json успешно обновлен и отправлен в репозиторий."
          fi
