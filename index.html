<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greenway Экомаркет</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --bg-color: #f7f9f6;
      --card-bg: #ffffff;
      --text-main: #212121;
      --text-muted: #757575;
      --border-color: #e0e0e0;
      --accent-red: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      background: var(--card-bg);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .category-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: var(--card-bg);
      white-space: nowrap;
      border-bottom: 1px solid var(--border-color);
    }

    .category-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .category-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .container {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-color);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #eee;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      height: 36px;
      overflow: hidden;
    }

    .product-category {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Нижняя панель корзины */
    .cart-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .cart-total-preview {
      display: flex;
      flex-direction: column;
    }

    .cart-total-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .cart-total-amount {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .open-cart-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Модальное окно оформления */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 50;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .close-modal-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .cart-items-list {
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 13px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Промокод */
    .promo-wrapper {
      margin: 12px 0;
    }

    .promo-box {
      display: flex;
      gap: 8px;
    }

    .promo-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .promo-box button {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .promo-status {
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    .totals-breakdown {
      background: #f9fbf8;
      border-radius: 8px;
      padding: 12px;
      margin: 14px 0;
      font-size: 13px;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .totals-row.final {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    .submit-order-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌿 Greenway Экомаркет</h1>
    <span style="font-size: 12px; color: var(--text-muted);">MAX Мини-приложение</span>
  </header>

  <div class="category-filter" id="categoryFilter">
    <button class="category-btn active" onclick="filterCategory('all')">Все</button>
    <button class="category-btn" onclick="filterCategory('Green Fiber')">Green Fiber</button>
    <button class="category-btn" onclick="filterCategory('BioTrim')">BioTrim</button>
    <button class="category-btn" onclick="filterCategory('Welllab')">Welllab</button>
    <button class="category-btn" onclick="filterCategory('Balancer')">Balancer</button>
    <button class="category-btn" onclick="filterCategory('Sharme')">Sharme</button>
    <button class="category-btn" onclick="filterCategory('Enjoy Care')">Enjoy Care</button>
  </div>

  <main class="container" id="productsContainer"></main>

  <div class="cart-bottom-bar" id="cartBar" style="display: none;">
    <div class="cart-total-preview">
      <span class="cart-total-label">В корзине:</span>
      <span class="cart-total-amount" id="barTotalAmount">0 ₽</span>
    </div>
    <button class="open-cart-btn" onclick="openCartModal()">Оформить заказ 🛒</button>
  </div>

  <!-- Модальное окно корзины -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Оформление заказа</h2>
        <button class="close-modal-btn" onclick="closeCartModal()">✕</button>
      </div>

      <div class="cart-items-list" id="modalCartItems"></div>

      <!-- Поле промокода -->
      <div class="promo-wrapper">
        <div class="promo-box">
          <input type="text" id="promoInput" placeholder="Промокод (например: ZLATA)">
          <button type="button" id="applyPromoBtn" onclick="applyPromoCode()">Применить</button>
        </div>
        <div class="promo-status" id="promoMessage"></div>
      </div>

      <!-- Сводка сумм -->
      <div class="totals-breakdown">
        <div class="totals-row">
          <span>Сумма товаров:</span>
          <span id="subtotalSpan">0 ₽</span>
        </div>
        <div class="totals-row">
          <span>Доставка (курьер):</span>
          <span id="deliverySpan">500 ₽</span>
        </div>
        <div class="totals-row final">
          <span>Итого к оплате:</span>
          <span id="grandTotalSpan">0 ₽</span>
        </div>
      </div>

      <!-- Контакты покупателя -->
      <form id="orderForm" onsubmit="handleOrderSubmit(event)">
        <div class="form-group">
          <label>Имя и фамилия *</label>
          <input type="text" id="custName" placeholder="Иван Иванов" required>
        </div>
        <div class="form-group">
          <label>Номер телефона *</label>
          <input type="tel" id="custPhone" placeholder="+7 999 000-00-00" required>
        </div>
        <div class="form-group">
          <label>Адрес доставки (город, улица, дом, кв.) *</label>
          <input type="text" id="custAddress" placeholder="г. Москва, ул. Ленина, д. 1, кв. 10" required>
        </div>

        <button type="submit" class="submit-order-btn" id="submitBtn">Подтвердить и отправить заказ</button>
      </form>
    </div>
  </div>

  <script>
    // URL Google Apps Script для логирования заказов
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5_pWJg1U_2uBv4056n6W-f9e4e_example/exec"; // Замените на ваш рабочий /exec URL

    let products = [];
    let cart = {}; // id -> count
    let isFreeDeliveryPromoApplied = false;
    let appliedPromoName = "";

    // Загрузка каталога
    async function initCatalog() {
      try {
        const res = await fetch('products.json');
        products = await res.json();
        renderProducts(products);
      } catch (e) {
        console.error('Ошибка загрузки products.json:', e);
      }
    }

    function renderProducts(items) {
      const cont = document.getElementById('productsContainer');
      cont.innerHTML = items.map(p => `
        <div class="product-card">
          <img class="product-img" src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
          <div>
            <div class="product-category">${p.category}</div>
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString('ru-RU')} ₽</div>
          </div>
          <button class="add-to-cart-btn" onclick="addToCart(${p.id})">В корзину</button>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'all') {
        renderProducts(products);
      } else {
        renderProducts(products.filter(p => p.category === cat));
      }
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartTotals();
    }

    function changeQty(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      renderCartModalItems();
      updateCartTotals();
    }

    // Промокод
    function applyPromoCode() {
      const input = document.getElementById('promoInput');
      const msg = document.getElementById('promoMessage');
      const code = input.value.trim().toUpperCase();

      const alreadyUsed = localStorage.getItem('promo_zlata_used');

      if (code === 'ZLATA') {
        if (alreadyUsed === 'true') {
          msg.textContent = '❌ Промокод Zlata уже использован на этом устройстве.';
          msg.style.color = 'var(--accent-red)';
          isFreeDeliveryPromoApplied = false;
          appliedPromoName = "";
        } else {
          isFreeDeliveryPromoApplied = true;
          appliedPromoName = "ZLATA";
          msg.textContent = '✅ Промокод ZLATA применён: бесплатная доставка!';
          msg.style.color = 'var(--primary)';
          input.disabled = true;
          document.getElementById('applyPromoBtn').disabled = true;
          document.getElementById('applyPromoBtn').style.opacity = '0.5';
        }
      } else if (code === '') {
        msg.textContent = 'Введите промокод.';
        msg.style.color = '#757575';
      } else {
        msg.textContent = '❌ Неверный промокод.';
        msg.style.color = 'var(--accent-red)';
        isFreeDeliveryPromoApplied = false;
        appliedPromoName = "";
      }
      updateCartTotals();
    }

    function calculateSubtotal() {
      return Object.entries(cart).reduce((sum, [id, qty]) => {
        const prod = products.find(p => p.id === parseInt(id));
        return sum + (prod ? prod.price * qty : 0);
      }, 0);
    }

    function calculateDelivery(subtotal) {
      if (subtotal === 0) return 0;
      // Бесплатно при промокоде ZLATA или от 3 000 руб
      if (isFreeDeliveryPromoApplied || subtotal >= 3000) {
        return 0;
      }
      return 500;
    }

    function updateCartTotals() {
      const subtotal = calculateSubtotal();
      const delivery = calculateDelivery(subtotal);
      const grandTotal = subtotal + delivery;

      const cartBar = document.getElementById('cartBar');
      if (subtotal > 0) {
        cartBar.style.display = 'flex';
        document.getElementById('barTotalAmount').textContent = `${grandTotal.toLocaleString('ru-RU')} ₽`;
      } else {
        cartBar.style.display = 'none';
        closeCartModal();
      }

      document.getElementById('subtotalSpan').textContent = `${subtotal.toLocaleString('ru-RU')} ₽`;
      
      const delivSpan = document.getElementById('deliverySpan');
      if (delivery === 0 && subtotal > 0) {
        delivSpan.textContent = '0 ₽ (Бесплатно)';
        delivSpan.style.color = 'var(--primary)';
      } else {
        delivSpan.textContent = `${delivery} ₽`;
        delivSpan.style.color = 'var(--text-main)';
      }

      document.getElementById('grandTotalSpan').textContent = `${grandTotal.toLocaleString('ru-RU')} ₽`;
    }

    function openCartModal() {
      renderCartModalItems();
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function renderCartModalItems() {
      const container = document.getElementById('modalCartItems');
      const entries = Object.entries(cart);
      if (entries.length === 0) {
        container.innerHTML = '<div style="padding: 16px; text-align: center; color: #757575;">Корзина пуста</div>';
        return;
      }

      container.innerHTML = entries.map(([id, qty]) => {
        const p = products.find(item => item.id === parseInt(id));
        if (!p) return '';
        return `
          <div class="cart-row">
            <div>
              <div style="font-weight: 600;">${p.name}</div>
              <div style="color: var(--text-muted); font-size: 11px;">${p.price} ₽ × ${qty} шт.</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" type="button" onclick="changeQty(${p.id}, -1)">−</button>
              <span>${qty}</span>
              <button class="qty-btn" type="button" onclick="changeQty(${p.id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Отправка заказа
    async function handleOrderSubmit(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const subtotal = calculateSubtotal();
      const delivery = calculateDelivery(subtotal);
      const total = subtotal + delivery;

      const itemsList = Object.entries(cart).map(([id, qty]) => {
        const p = products.find(item => item.id === parseInt(id));
        return `${p.name} (x${qty}) — ${p.price * qty} ₽`;
      }).join('\n');

      const promoInfo = appliedPromoName ? appliedPromoName : 'нет';

      // Текст заказа для клиента и буфера обмена
      const orderMessage = 
`📦 НОВЫЙ ЗАКАЗ GREENWAY
👤 Клиент: ${name}
📞 Телефон: ${phone}
📍 Адрес: ${address}
🎟 Промокод: ${promoInfo}

Состав заказа:
${itemsList}

Сумма товаров: ${subtotal} ₽
Доставка: ${delivery === 0 ? '0 ₽ (Бесплатно)' : delivery + ' ₽'}
💰 ИТОГО К ОПЛАТЕ: ${total} ₽`;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Оформляем...';

      // 1. Помечаем промокод ZLATA как использованный
      if (appliedPromoName === 'ZLATA') {
        localStorage.setItem('promo_zlata_used', 'true');
      }

      // 2. Отправка в Google Таблицу через Apps Script
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            phone: "'" + phone, // апостроф для защиты формата номера
            address: address,
            promo: promoInfo,
            items: itemsList.replace(/\n/g, '; '),
            subtotal: subtotal,
            delivery: delivery,
            total: total,
            date: new Date().toLocaleString('ru-RU')
          })
        });
      } catch (err) {
        console.warn('Локальная ошибка сети при отправке таблицы:', err);
      }

      // 3. Копируем в буфер обмена для подтверждения в чате МАКС
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(orderMessage);
        } catch (_) {}
      }

      alert('✅ Заказ успешно оформлен!\nДанные скопированы в буфер обмена. Отправьте скопированный текст в чат боту для подтверждения менеджером.');
      
      // Сброс корзины
      cart = {};
      closeCartModal();
      updateCartTotals();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Подтвердить и отправить заказ';
    }

    initCatalog();
  </script>
</body>
</html>
