<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greenway Global — Экомаркет</title>
  <style>
    :root {
      --primary: #00875A;
      --primary-dark: #006644;
      --accent: #E58E26;
      --bg: #F4F6F8;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 95px; }

    header { background: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 25; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
    .badge { background: #E8F5E9; color: var(--primary); font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: 600; }
    .badge-preorder { background: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }

    /* Поиск */
    .search-wrap { padding: 10px 16px 4px; background: #fff; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; background: var(--bg); }
    .search-input:focus { border-color: var(--primary); background: #fff; }

    /* Навигация 1-го уровня */
    .nav-wrap { background: #fff; position: sticky; top: 53px; z-index: 20; border-bottom: 1px solid var(--border); }
    .tabs-main { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs-main::-webkit-scrollbar { display: none; }
    .tab-main { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--bg); color: var(--text-muted); cursor: pointer; white-space: nowrap; border: 1px solid transparent; user-select: none; }
    .tab-main.active { background: var(--primary); color: #fff; font-weight: 600; }
    .tab-main.special { border: 1px dashed var(--accent); color: var(--accent); }
    .tab-main.special.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Навигация 2-го уровня */
    .subtabs-wrap { background: #FAFAFA; border-bottom: 1px solid var(--border); display: none; }
    .tabs-sub { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs-sub::-webkit-scrollbar { display: none; }
    .tab-sub { padding: 4px 11px; border-radius: 14px; font-size: 12px; font-weight: 500; background: #fff; color: var(--text-muted); cursor: pointer; white-space: nowrap; border: 1px solid var(--border); user-select: none; }
    .tab-sub.active { background: #E8F5E9; color: var(--primary-dark); border-color: var(--primary); font-weight: 600; }

    /* Сетка товаров */
    .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; }
    .card-img-wrap { position: relative; width: 100%; height: 125px; margin-bottom: 8px; }
    .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; background: #eee; }
    .card-chip { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .card-price { font-size: 14px; font-weight: 700; color: var(--primary-dark); }

    /* Кнопки */
    .btn-add { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-add.btn-preorder { background: var(--accent); }
    .qty-controls { display: none; align-items: center; gap: 6px; }
    .btn-qty { background: var(--bg); border: 1px solid var(--border); width: 26px; height: 26px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-num { font-size: 13px; font-weight: 600; min-width: 14px; text-align: center; }

    /* Корзина */
    .cart-bar { position: fixed; bottom: 16px; left: 16px; right: 16px; background: var(--primary); color: #fff; border-radius: 14px; padding: 14px 18px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 135, 90, 0.35); z-index: 50; cursor: pointer; }
    .cart-bar span { font-weight: 600; font-size: 14px; }

    /* Шторки */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 20px 16px; max-height: 85vh; overflow-y: auto; z-index: 101; display: none; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }

    /* Детали */
    .detail-img { width: 100%; height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; }
    .detail-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .detail-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .detail-text { font-size: 14px; line-height: 1.5; color: var(--text); margin-bottom: 20px; }
    .detail-action { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
    .detail-price { font-size: 18px; font-weight: 700; color: var(--primary-dark); }

    /* Окно корзины */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .empty-cart-msg { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 14px; }
  </style>
</head>

      { id: 610, category: "beauty", category_name: "Косметика и уход", subcategory: "aroma", subcategory_name: "Эфирные масла", title: "Эфирное масло Sharme Essential Лаванда", short_desc: "100% чистое эфирное масло французской лаванды", full_desc: "Натуральное масло для аромаламп, ванн и массажа. Снимает стресс и настраивает на здоровый сон.", price: 440, volume: "5 мл", img: "images/sharme-lavender.jpg" },

    ];

    var allProducts = PRODUCTS;
    var cart = {};
    var currentMainCat = 'all';
    var currentSubCat = 'all';
    var searchQuery = '';

    function buildMainCategories() {
      var box = document.getElementById('mainCategoryTabs');
      if (!box) return;

      var cats = {};
      for (var i = 0; i < allProducts.length; i++) {
        var p = allProducts[i];
        if (p.category && !cats[p.category]) {
          cats[p.category] = {
            name: p.category_name || p.category,
            isSpecial: (p.category === 'perfume_preorder')
          };
        }
      }

      box.innerHTML = '';

      var allBtn = document.createElement('div');
      allBtn.className = 'tab-main' + (currentMainCat === 'all' ? ' active' : '');
      allBtn.textContent = 'Все товары';
      allBtn.onclick = function() { selectMainCategory('all'); };
      box.appendChild(allBtn);

      for (var key in cats) {
        (function(catKey) {
          var item = cats[catKey];
          var btn = document.createElement('div');
          btn.className = 'tab-main' + (item.isSpecial ? ' special' : '') + (currentMainCat === catKey ? ' active' : '');
          btn.textContent = (item.isSpecial ? '✨ ' : '') + item.name;
          btn.onclick = function() { selectMainCategory(catKey); };
          box.appendChild(btn);
        })(key);
      }
    }

    function selectMainCategory(catKey) {
      currentMainCat = catKey;
      currentSubCat = 'all';
      buildMainCategories();
      buildSubCategories(catKey);
      renderCatalog();
    }

    function buildSubCategories(mainCat) {
      var wrap = document.getElementById('subCategoryWrap');
      var box = document.getElementById('subCategoryTabs');
      if (!wrap || !box) return;

      if (mainCat === 'all') {
        wrap.style.display = 'none';
        return;
      }

      var subcats = {};
      for (var i = 0; i < allProducts.length; i++) {
        var p = allProducts[i];
        if (p.category === mainCat && p.subcategory && !subcats[p.subcategory]) {
          subcats[p.subcategory] = p.subcategory_name || p.subcategory;
        }
      }

      var subKeys = Object.keys(subcats);
      if (subKeys.length <= 1) {
        wrap.style.display = 'none';
        return;
      }

      box.innerHTML = '';
      var allSubBtn = document.createElement('div');
      allSubBtn.className = 'tab-sub' + (currentSubCat === 'all' ? ' active' : '');
      allSubBtn.textContent = 'Все в разделе';
      allSubBtn.onclick = function() { selectSubCategory('all'); };
      box.appendChild(allSubBtn);

      for (var j = 0; j < subKeys.length; j++) {
        (function(subKey) {
          var btn = document.createElement('div');
          btn.className = 'tab-sub' + (currentSubCat === subKey ? ' active' : '');
          btn.textContent = subcats[subKey];
          btn.onclick = function() { selectSubCategory(subKey); };
          box.appendChild(btn);
        })(subKeys[j]);
      }

      wrap.style.display = 'block';
    }

    function selectSubCategory(subKey) {
      currentSubCat = subKey;
      buildSubCategories(currentMainCat);
      renderCatalog();
    }

    function handleSearch() {
      var input = document.getElementById('searchInput');
      searchQuery = input ? input.value.trim().toLowerCase() : '';
      renderCatalog();
    }

    function renderCatalog() {
      var container = document.getElementById('catalogList');
      if (!container) return;

      var filtered = [];
      for (var i = 0; i < allProducts.length; i++) {
        var p = allProducts[i];
        var matchMain = (currentMainCat === 'all' || p.category === currentMainCat);
        var matchSub = (currentSubCat === 'all' || p.subcategory === currentSubCat);
        var matchSearch = (!searchQuery || 
          p.title.toLowerCase().indexOf(searchQuery) !== -1 || 
          (p.short_desc && p.short_desc.toLowerCase().indexOf(searchQuery) !== -1)
        );
        if (matchMain && matchSub && matchSearch) {
          filtered.push(p);
        }
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #6b7280; padding: 40px 10px;">Товаров не найдено.</div>';
        return;
      }

      container.innerHTML = '';

      for (var k = 0; k < filtered.length; k++) {
        (function(p) {
          var count = cart[p.id] || 0;
          var isPreorder = p.is_preorder;

          var card = document.createElement('div');
          card.className = 'card';
          card.onclick = function() { openDetail(p.id); };

          var imgWrap = document.createElement('div');
          imgWrap.className = 'card-img-wrap';

          var img = document.createElement('img');
          img.src = p.img;
          img.alt = p.title;
          img.loading = 'lazy';
          img.onerror = function() {
            this.onerror = null;
            this.src = 'https://dummyimage.com/300x200/e8f5e9/00875a.png&text=🌿+Greenway';
          };
          imgWrap.appendChild(img);

          if (isPreorder) {
            var chip = document.createElement('div');
            chip.className = 'card-chip badge-preorder';
            chip.textContent = 'Под заказ';
            imgWrap.appendChild(chip);
          }

          var title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = p.title;

          var desc = document.createElement('div');
          desc.className = 'card-desc';
          desc.textContent = p.short_desc || '';

          var bottom = document.createElement('div');
          bottom.className = 'card-bottom';
          bottom.onclick = function(e) { e.stopPropagation(); };

          var price = document.createElement('div');
          price.className = 'card-price';
          price.textContent = p.price + ' ₽';

          var addBtn = document.createElement('button');
          addBtn.className = isPreorder ? 'btn-add btn-preorder' : 'btn-add';
          addBtn.id = 'addBtn-' + p.id;
          addBtn.style.display = count > 0 ? 'none' : 'block';
          addBtn.textContent = isPreorder ? 'Предзаказ' : '+ В корзину';
          addBtn.onclick = function() { changeQty(p.id, 1); };

          var qtyBox = document.createElement('div');
          qtyBox.className = 'qty-controls';
          qtyBox.id = 'qtyBox-' + p.id;
          qtyBox.style.display = count > 0 ? 'flex' : 'none';

          var minusBtn = document.createElement('button');
          minusBtn.className = 'btn-qty';
          minusBtn.textContent = '−';
          minusBtn.onclick = function() { changeQty(p.id, -1); };

          var qtyNum = document.createElement('span');
          qtyNum.className = 'qty-num';
          qtyNum.id = 'qtyNum-' + p.id;
          qtyNum.textContent = count;

          var plusBtn = document.createElement('button');
          plusBtn.className = 'btn-qty';
          plusBtn.textContent = '+';
          plusBtn.onclick = function() { changeQty(p.id, 1); };

          qtyBox.appendChild(minusBtn);
          qtyBox.appendChild(qtyNum);
          qtyBox.appendChild(plusBtn);

          bottom.appendChild(price);
          bottom.appendChild(addBtn);
          bottom.appendChild(qtyBox);

          card.appendChild(imgWrap);
          card.appendChild(title);
          card.appendChild(desc);
          card.appendChild(bottom);

          container.appendChild(card);
        })(filtered[k]);
      }
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      
      updateProductCardUI(id);
      updateCartBar();
      var cartSheet = document.getElementById('cartSheet');
      if (cartSheet && cartSheet.style.display === 'block') {
        renderCartSheet();
      }
      var detailSheet = document.getElementById('detailSheet');
      if (detailSheet && detailSheet.style.display === 'block') {
        updateDetailButton(id);
      }
    }

    function updateProductCardUI(id) {
      var count = cart[id] || 0;
      var addBtn = document.getElementById('addBtn-' + id);
      var qtyBox = document.getElementById('qtyBox-' + id);
      var qtyNum = document.getElementById('qtyNum-' + id);

      if (addBtn && qtyBox) {
        addBtn.style.display = count > 0 ? 'none' : 'block';
        qtyBox.style.display = count > 0 ? 'flex' : 'none';
        if (qtyNum) qtyNum.textContent = count;
      }
    }

    function updateCartBar() {
      var totalCount = 0;
      var totalPrice = 0;

      for (var id in cart) {
        var p = null;
        for (var i = 0; i < allProducts.length; i++) {
          if (allProducts[i].id == id) { p = allProducts[i]; break; }
        }
        if (p) {
          totalCount += cart[id];
          totalPrice += cart[id] * p.price;
        }
      }

      var bar = document.getElementById('cartBar');
      if (!bar) return;

      if (totalCount > 0) {
        bar.style.display = 'flex';
        var countEl = document.getElementById('cartCount');
        var totalEl = document.getElementById('cartTotal');
        if (countEl) countEl.textContent = 'В корзине: ' + totalCount + ' шт.';
        if (totalEl) totalEl.textContent = totalPrice + ' ₽ ›';
      } else {
        bar.style.display = 'none';
      }
    }

    function openDetail(id) {
      var p = null;
      for (var i = 0; i < allProducts.length; i++) {
        if (allProducts[i].id == id) { p = allProducts[i]; break; }
      }
      if (!p) return;

      var dImg = document.getElementById('detailImg');
      if (dImg) {
        dImg.onerror = function() {
          this.onerror = null;
          this.src = 'https://dummyimage.com/600x400/e8f5e9/00875a.png&text=🌿+Greenway+Global';
        };
        dImg.src = p.img;
      }

      var titleEl = document.getElementById('detailTitle');
      if (titleEl) titleEl.textContent = p.title;
      
      var catBadge = document.getElementById('detailCategory');
      if (catBadge) {
        catBadge.textContent = p.is_preorder ? 'Парфюмерия под заказ' : (p.subcategory_name || p.category_name || 'Товар');
        catBadge.className = p.is_preorder ? 'badge badge-preorder' : 'badge';
      }

      var metaEl = document.getElementById('detailMeta');
      if (metaEl) metaEl.textContent = p.volume ? 'Фасовка / объем: ' + p.volume : '';

      var descEl = document.getElementById('detailDesc');
      if (descEl) descEl.textContent = p.full_desc || p.short_desc || 'Описание отсутствует.';

      var priceEl = document.getElementById('detailPrice');
      if (priceEl) priceEl.textContent = p.price + ' ₽';

      updateDetailButton(id);

      var overlay = document.getElementById('overlay');
      var detailSheet = document.getElementById('detailSheet');
      if (overlay) overlay.style.display = 'block';
      if (detailSheet) detailSheet.style.display = 'block';
    }

    function updateDetailButton(id) {
      var p = null;
      for (var i = 0; i < allProducts.length; i++) {
        if (allProducts[i].id == id) { p = allProducts[i]; break; }
      }
      var count = cart[id] || 0;
      var box = document.getElementById('detailBtnContainer');
      if (!box) return;

      var isPreorder = p && p.is_preorder;
      box.innerHTML = '';

      if (count > 0) {
        var wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex; align-items:center; gap:8px;';

        var minusBtn = document.createElement('button');
        minusBtn.className = 'btn-qty';
        minusBtn.textContent = '−';
        minusBtn.onclick = function() { changeQty(id, -1); };

        var num = document.createElement('span');
        num.style.cssText = 'font-weight:700; min-width:16px; text-align:center;';
        num.textContent = count;

        var plusBtn = document.createElement('button');
        plusBtn.className = 'btn-qty';
        plusBtn.textContent = '+';
        plusBtn.onclick = function() { changeQty(id, 1); };

        wrap.appendChild(minusBtn);
        wrap.appendChild(num);
        wrap.appendChild(plusBtn);
        box.appendChild(wrap);
      } else {
        var btn = document.createElement('button');
        btn.className = 'btn-add' + (isPreorder ? ' btn-preorder' : '');
        btn.style.cssText = 'padding:10px 18px; font-size:14px;';
        btn.textContent = isPreorder ? 'Оформить предзаказ' : '+ В корзину';
        btn.onclick = function() { changeQty(id, 1); };
        box.appendChild(btn);
      }
    }

    function openCartSheet() {
      renderCartSheet();
      var overlay = document.getElementById('overlay');
      var cartSheet = document.getElementById('cartSheet');
      if (overlay) overlay.style.display = 'block';
      if (cartSheet) cartSheet.style.display = 'block';
    }

    function renderCartSheet() {
      var container = document.getElementById('cartItemsContainer');
      if (!container) return;

      var totalSum = 0;
      var keys = Object.keys(cart);

      if (keys.length === 0) {
        container.innerHTML = '<div class="empty-cart-msg">Корзина пуста</div>';
        var sumEl = document.getElementById('cartTotalSum');
        if (sumEl) sumEl.textContent = '0 ₽';
        return;
      }

      container.innerHTML = '';

      for (var i = 0; i < keys.length; i++) {
        (function(id) {
          var p = null;
          for (var j = 0; j < allProducts.length; j++) {
            if (allProducts[j].id == id) { p = allProducts[j]; break; }
          }
          if (!p) return;
          var count = cart[id];
          var sum = count * p.price;
          totalSum += sum;

          var item = document.createElement('div');
          item.className = 'cart-item';

          var info = document.createElement('div');
          info.style.maxWidth = '60%';

          var title = document.createElement('b');
          title.textContent = p.title;
          info.appendChild(title);

          if (p.is_preorder) {
            var pre = document.createElement('span');
            pre.style.cssText = 'color:#E65100; font-weight:600; font-size:10px;';
            pre.textContent = ' [ПОД ЗАКАЗ]';
            info.appendChild(pre);
          }

          var priceNote = document.createElement('div');
          priceNote.style.cssText = 'color:var(--text-muted); font-size:11px;';
          priceNote.textContent = p.price + ' ₽ / шт.';
          info.appendChild(priceNote);

          var actions = document.createElement('div');
          actions.style.cssText = 'display:flex; align-items:center; gap:10px;';

          var ctrls = document.createElement('div');
          ctrls.style.cssText = 'display:flex; align-items:center; gap:5px;';

          var minusBtn = document.createElement('button');
          minusBtn.className = 'btn-qty';
          minusBtn.textContent = '−';
          minusBtn.onclick = function() { changeQty(p.id, -1); };

          var num = document.createElement('span');
          num.className = 'qty-num';
          num.textContent = count;

          var plusBtn = document.createElement('button');
          plusBtn.className = 'btn-qty';
          plusBtn.textContent = '+';
          plusBtn.onclick = function() { changeQty(p.id, 1); };

          ctrls.appendChild(minusBtn);
          ctrls.appendChild(num);
          ctrls.appendChild(plusBtn);

          var sumItemEl = document.createElement('div');
          sumItemEl.style.cssText = 'font-weight:700; min-width:55px; text-align:right;';
          sumItemEl.textContent = sum + ' ₽';

          actions.appendChild(ctrls);
          actions.appendChild(sumItemEl);

          item.appendChild(info);
          item.appendChild(actions);
          container.appendChild(item);
        })(keys[i]);
      }

      var totalSumEl = document.getElementById('cartTotalSum');
      if (totalSumEl) totalSumEl.textContent = totalSum + ' ₽';
    }

    function closeAllSheets() {
      var overlay = document.getElementById('overlay');
      var detailSheet = document.getElementById('detailSheet');
      var cartSheet = document.getElementById('cartSheet');
      if (overlay) overlay.style.display = 'none';
      if (detailSheet) detailSheet.style.display = 'none';
      if (cartSheet) cartSheet.style.display = 'none';
    }

    // Привязка обработчиков интерфейса
    document.getElementById('searchInput').oninput = handleSearch;
    document.getElementById('cartBar').onclick = openCartSheet;
    document.getElementById('overlay').onclick = closeAllSheets;
    document.getElementById('closeDetailBtn').onclick = closeAllSheets;
    document.getElementById('closeCartBtn').onclick = closeAllSheets;

    // Прямой запуск: разметка уже загружена выше по коду
    buildMainCategories();
    renderCatalog();
  </script>
</body>
