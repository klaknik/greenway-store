<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greenway Global — Экомаркет</title>
  <style>
    :root {
      --primary: #00875A;
      --primary-dark: #006644;
      --bg: #F4F6F8;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    header { background: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
    .badge { background: #E8F5E9; color: var(--primary); font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: 600; }

    /* Категории */
    .tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; background: #fff; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--bg); color: var(--text-muted); cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
    .tab.active { background: var(--primary); color: #fff; }

    /* Сетка товаров */
    .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: #eee; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; flex-grow: 1; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .card-price { font-size: 14px; font-weight: 700; color: var(--primary-dark); }
    
    .btn-add { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .qty-controls { display: none; align-items: center; gap: 6px; }
    .btn-qty { background: var(--bg); border: 1px solid var(--border); width: 26px; height: 26px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-num { font-size: 13px; font-weight: 600; min-width: 14px; text-align: center; }

    /* Плавающая корзина */
    .cart-bar { position: fixed; bottom: 16px; left: 16px; right: 16px; background: var(--primary); color: #fff; border-radius: 14px; padding: 14px 18px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 135, 90, 0.35); z-index: 50; cursor: pointer; }
    .cart-bar span { font-weight: 600; font-size: 14px; }

    /* Модальное окно корзины */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; }
    .modal-content { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 20px 16px; max-height: 80vh; overflow-y: auto; z-index: 101; transform: translateY(100%); transition: transform 0.25s ease-out; }
    .modal-content.open { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { font-size: 17px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .btn-checkout { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; margin-top: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🌿 Greenway Global</h1>
    <div class="badge">Эко-маркет</div>
  </header>

  <!-- Категории -->
  <div class="tabs">
    <div class="tab active" onclick="filterCategory('all', this)">Все товары</div>
    <div class="tab" onclick="filterCategory('home', this)">Уход за домом</div>
    <div class="tab" onclick="filterCategory('health', this)">Здоровье</div>
    <div class="tab" onclick="filterCategory('beauty', this)">Красота</div>
  </div>

  <!-- Список товаров -->
  <div class="catalog" id="catalog"></div>

  <!-- Плавающая кнопка корзины -->
  <div class="cart-bar" id="cartBar" onclick="openCartModal()">
    <span id="cartCount">Корзина: 0 шт.</span>
    <span id="cartTotal">0 ₽ ›</span>
  </div>

  <!-- Модальное окно оформления -->
  <div class="modal-overlay" id="overlay" onclick="closeCartModal()"></div>
  <div class="modal-content" id="cartModal">
    <div class="modal-header">
      <h2>Ваш заказ</h2>
      <button onclick="closeCartModal()" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
    </div>
    <div id="cartList"></div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:700;font-size:16px;">
      <span>Итого:</span>
      <span id="modalTotal">0 ₽</span>
    </div>
    <button class="btn-checkout" onclick="submitOrder()">Оформить заказ в 1 клик</button>
  </div>

  <script>
    // База товаров (можно дополнять своими позициями)
    const products = [
      { id: 1, category: 'home', title: "Файбер для мытья посуды", desc: "Моет посуду без капли бытовой химии", price: 330, img: "https://images.unsplash.com/photo-1584634731339-252c581abfc5?w=300" },
      { id: 2, category: 'home', title: "Файбер для стекла", desc: "Идеальная чистота зеркал без разводов", price: 490, img: "https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=300" },
      { id: 3, category: 'home', title: "Паста очищающая Mystik", desc: "Удаляет нагар, ржавчину и известковый налет", price: 380, img: "https://images.unsplash.com/photo-1563453392212-326f5e854473?w=300" },
      { id: 4, category: 'health', title: "Напиток DrainEffect", desc: "Выводит лишнюю жидкость, снимает отеки", price: 1150, img: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=300" },
      { id: 5, category: 'health', title: "Чайный напиток Fresh", desc: "Мягкое очищение организма и пищеварения", price: 420, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=300" },
      { id: 6, category: 'beauty', title: "Твердый шампунь цитрус", desc: "Натуральный уход и блеск волос", price: 490, img: "https://images.unsplash.com/photo-1608248597359-598d1a129d21?w=300" }
    ];

    let cart = {}; // id -> count

    function renderCatalog(items) {
      const container = document.getElementById('catalog');
      container.innerHTML = '';
      items.forEach(p => {
        const count = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.title}">
          <div class="card-title">${p.title}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-bottom">
            <div class="card-price">${p.price} ₽</div>
            <button class="btn-add" id="addBtn-${p.id}" style="display: ${count > 0 ? 'none' : 'block'}" onclick="changeQty(${p.id}, 1)">+ В корзину</button>
            <div class="qty-controls" id="qtyBox-${p.id}" style="display: ${count > 0 ? 'flex' : 'none'}">
              <button class="btn-qty" onclick="changeQty(${p.id}, -1)">−</button>
              <span class="qty-num" id="qtyNum-${p.id}">${count}</span>
              <button class="btn-qty" onclick="changeQty(${p.id}, 1)">+</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      updateUI();
    }

    function updateUI() {
      products.forEach(p => {
        const count = cart[p.id] || 0;
        const addBtn = document.getElementById(`addBtn-${p.id}`);
        const qtyBox = document.getElementById(`qtyBox-${p.id}`);
        const qtyNum = document.getElementById(`qtyNum-${p.id}`);
        if (addBtn && qtyBox) {
          addBtn.style.display = count > 0 ? 'none' : 'block';
          qtyBox.style.display = count > 0 ? 'flex' : 'none';
          if (qtyNum) qtyNum.innerText = count;
        }
      });

      let totalCount = 0;
      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        const p = products.find(x => x.id == id);
        if (p) {
          totalCount += cart[id];
          totalPrice += cart[id] * p.price;
        }
      });

      const bar = document.getElementById('cartBar');
      if (totalCount > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartCount').innerText = `В корзине: ${totalCount} шт.`;
        document.getElementById('cartTotal').innerText = `${totalPrice} ₽ ›`;
      } else {
        bar.style.display = 'none';
        closeCartModal();
      }
    }

    function filterCategory(cat, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
      renderCatalog(filtered);
    }

    function openCartModal() {
      const list = document.getElementById('cartList');
      list.innerHTML = '';
      let sum = 0;
      Object.keys(cart).forEach(id => {
        const p = products.find(x => x.id == id);
        const count = cart[id];
        sum += count * p.price;
        list.innerHTML += `
          <div class="cart-item">
            <div><b>${p.title}</b><br><small>${count} × ${p.price} ₽</small></div>
            <div style="font-weight:700;">${count * p.price} ₽</div>
          </div>
        `;
      });
      document.getElementById('modalTotal').innerText = `${sum} ₽`;
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCartModal() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('cartModal').classList.remove('open');
    }

    function submitOrder() {
      // Собираем массив заказанных товаров
      const orderItems = Object.keys(cart).map(id => {
        const p = products.find(x => x.id == id);
        return { id: p.id, title: p.title, price: p.price, count: cart[id] };
      });

      // Передача данных приложению мессенджера (Telegram / MAX WebApp)
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify(orderItems));
      } else {
        // Fallback для тестов в обычном браузере: редирект на реферальную ссылку
        alert('Заказ сформирован! Перенаправляем на оплату...');
        window.location.href = "https://greenwayglobal.com/invite/client/GW-792841";
      }
    }

    // Первый рендер
    renderCatalog(products);
  </script>
</body>
</html>
