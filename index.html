<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greenway Экомаркет</title>
  <style>
    :root {
      --primary: #107c41;
      --primary-hover: #0b5e31;
      --bg: #f8faf9;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
    }

    header {
      background: #ffffff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #f3f4f6;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fff;
    }

    .card-cat {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      height: 35px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 6px;
    }

    .card-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .btn-buy {
      width: 100%;
      padding: 9px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Карточка духов без цены */
    .perfume-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .perfume-card .card-cat {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
    }

    .perfume-card .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .perfume-card .card-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .btn-perfume-select {
      width: 100%;
      padding: 9px;
      background: #e8f5e9;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Блок "Не нашли нужный товар" на всю ширину без 0 ₽ */
    .not-found-banner {
      margin: 10px 16px 20px;
      padding: 16px;
      background: #ffffff;
      border: 1px dashed var(--primary);
      border-radius: 14px;
      text-align: center;
    }

    .not-found-banner h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--primary);
      font-weight: 700;
    }

    .not-found-banner p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .not-found-btn {
      display: inline-block;
      padding: 10px 20px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Нижняя панель */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }

    .cart-info-total {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-checkout {
      padding: 10px 22px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Модальные окна */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      align-items: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .qty-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-circle {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
    }

    /* Промокод */
    .promo-section {
      margin: 14px 0 10px;
    }

    .promo-input-row {
      display: flex;
      gap: 8px;
    }

    .promo-input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .promo-input-row button {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .promo-alert {
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    .order-summary {
      background: #f9fafb;
      padding: 12px;
      border-radius: 10px;
      margin: 14px 0;
      font-size: 13px;
    }

    .sum-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sum-row.total-line {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }

    .input-field {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .btn-final {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .perfume-select-group {
      margin-bottom: 14px;
    }

    .perfume-select-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .perfume-select-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 20px;">🌿</span>
      <span class="brand-title">Greenway Экомаркет</span>
    </div>
  </header>

  <div class="categories-bar" id="categoryTabs"></div>

  <!-- Сетка товаров -->
  <main class="grid-container" id="cardsContainer"></main>

  <!-- Блок "Не нашли нужный товар" -->
  <div class="not-found-banner">
    <h3>Не нашли нужный товар?</h3>
    <p>Напишите нам в чат — добавим любую позицию из каталога Greenway индивидуально!</p>
    <button class="not-found-btn" onclick="openCustomRequest()">Заказать через менеджера</button>
  </div>

  <!-- Нижняя панель корзины -->
  <div class="cart-bar" id="cartFooter" style="display: none;">
    <div>
      <div style="font-size: 11px; color: var(--text-muted);">Итого в заказе:</div>
      <div class="cart-info-total" id="footerTotal">0 ₽</div>
    </div>
    <button class="btn-checkout" onclick="openCart()">Корзина 🛒</button>
  </div>

  <!-- Модальное окно выбора парфюма Enjoy Care (без цены) -->
  <div class="modal-overlay" id="perfumeModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>Выбор аромата Enjoy Care</h2>
        <button class="modal-close" onclick="closePerfumeModal()">✕</button>
      </div>

      <div class="perfume-select-group">
        <label>Категория аромата:</label>
        <select id="perfumeGender" onchange="onGenderChange()">
          <option value="women">Женские ароматы (50 мл)</option>
          <option value="men">Мужские ароматы (50 мл)</option>
        </select>
      </div>

      <div class="perfume-select-group">
        <label>Выберите номер аромата:</label>
        <select id="perfumeNumber"></select>
      </div>

      <button class="btn-final" style="margin-top: 10px;" onclick="confirmPerfumeSelection()">Добавить аромат в заказ</button>
    </div>
  </div>

  <!-- Модальное окно корзины -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>Ваш заказ</h2>
        <button class="modal-close" onclick="closeCart()">✕</button>
      </div>

      <div id="cartItemsList"></div>

      <!-- Промокод -->
      <div class="promo-section">
        <div class="promo-input-row">
          <input type="text" id="promoInput" placeholder="Промокод (например: ZLATA)">
          <button type="button" onclick="applyPromoCode()">Применить</button>
        </div>
        <div class="promo-alert" id="promoAlert"></div>
      </div>

      <!-- Итоги -->
      <div class="order-summary">
        <div class="sum-row">
          <span>Сумма товаров:</span>
          <span id="sumSubtotal">0 ₽</span>
        </div>
        <div class="sum-row">
          <span>Доставка:</span>
          <span id="sumDelivery">500 ₽</span>
        </div>
        <div class="sum-row total-line">
          <span>К оплате:</span>
          <span id="sumTotal">0 ₽</span>
        </div>
      </div>

      <form onsubmit="sendOrder(event)">
        <input class="input-field" type="text" id="uName" placeholder="Ваше имя *" required>
        <input class="input-field" type="tel" id="uPhone" placeholder="Телефон *" required>
        <input class="input-field" type="text" id="uAddress" placeholder="Город и адрес доставки *" required>
        <button type="submit" class="btn-final" id="orderSubmitBtn">Оформить заказ</button>
      </form>
    </div>
  </div>

  <script>
    const PERFUME_OPTIONS = {
      women: [
        "№ 102 (в стиле Amor Amor)",
        "№ 111 (в стиле Anthology L'Imperatrice 3)",
        "№ 122 (в стиле Bright Crystal)",
        "№ 131 (в стиле Chance Eau Tendre)",
        "№ 148 (в стиле Good Girl Gone Bad)",
        "№ 150 (в стиле Lost Cherry)",
        "№ 154 (в стиле Fleur Narcotique)"
      ],
      men: [
        "№ 263 (в стиле Allure Homme Sport)",
        "№ 285 (в стиле Sauvage)",
        "№ 290 (в стиле Invictus)",
        "№ 298 (в стиле Aventus Creed)"
      ]
    };

    let allProducts = [];
    let cart = {}; 
    let isPromoFree = false;
    let activePromo = "";

    async function loadCatalog() {
      try {
        const res = await fetch('products.json');
        allProducts = await res.json();
        buildCategories();
        renderList(allProducts);
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function buildCategories() {
      const container = document.getElementById('categoryTabs');
      const cats = ['Все', ...new Set(
        allProducts
          .map(p => p.category)
          .filter(c => c && !['custom_request', 'perfume_preorder'].includes(c.toLowerCase()))
      )];
      
      container.innerHTML = cats.map((cat, i) => `
        <button class="cat-chip ${i === 0 ? 'active' : ''}" onclick="filterCat('${cat}', this)">${cat}</button>
      `).join('');
    }

    function filterCat(cat, btn) {
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (cat === 'Все') {
        renderList(allProducts);
      } else {
        renderList(allProducts.filter(p => p.category === cat));
      }
    }

    function renderList(items) {
      const cont = document.getElementById('cardsContainer');
      
      // Исключаем системную карточку Custom_request из обычной сетки,
      // чтобы она не выводилась как товар с 0 ₽
      const regularItems = items.filter(p => {
        const cat = (p.category || '').toLowerCase();
        return cat !== 'custom_request';
      });

      cont.innerHTML = regularItems.map(p => {
        const cat = (p.category || '').toLowerCase();
        const title = p.title || p.name || 'Товар Greenway';
        const img = p.img || p.image || p.imageUrl || '';
        const price = p.price || 0;

        // Если это духи Enjoy Care — убираем цену полностью
        if (cat === 'perfume_preorder' || title.toLowerCase().includes('enjoy care') || title.toLowerCase().includes('духи')) {
          return `
            <div class="perfume-card">
              <div>
                <div class="card-cat">Парфюм</div>
                <div class="card-title">Духи Enjoy Care (50 мл)</div>
                <div class="card-subtitle">Номерная коллекция премиум-ароматов</div>
              </div>
              <button class="btn-perfume-select" onclick="openPerfumeModal()">Выбрать аромат</button>
            </div>
          `;
        }

        // Стандартный товар
        return `
          <div class="card">
            <img class="card-img" src="${img}" alt="${title}">
            <div>
              <div class="card-cat">${p.category || ''}</div>
              <div class="card-title">${title}</div>
              <div class="card-price">${price} ₽</div>
            </div>
            <button class="btn-buy" onclick="addItem(${p.id})">В корзину</button>
          </div>
        `;
      }).join('');
    }

    // Выбор духов
    function openPerfumeModal() {
      document.getElementById('perfumeGender').value = 'women';
      onGenderChange();
      document.getElementById('perfumeModal').classList.add('active');
    }

    function onGenderChange() {
      const gender = document.getElementById('perfumeGender').value;
      const select = document.getElementById('perfumeNumber');
      select.innerHTML = PERFUME_OPTIONS[gender].map(num => `<option value="${num}">${num}</option>`).join('');
    }

    function closePerfumeModal() {
      document.getElementById('perfumeModal').classList.remove('active');
    }

    function confirmPerfumeSelection() {
      const fragrance = document.getElementById('perfumeNumber').value;
      const key = `perfume_${fragrance}`;

      if (cart[key]) {
        cart[key].qty += 1;
      } else {
        cart[key] = {
          title: `Духи Enjoy Care (${fragrance})`,
          price: 0,
          isPerfume: true,
          qty: 1
        };
      }
      closePerfumeModal();
      refreshTotals();
    }

    // Стандартные позиции
    function addItem(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      const key = `p_${id}`;

      if (cart[key]) {
        cart[key].qty += 1;
      } else {
        cart[key] = {
          title: p.title || p.name,
          price: p.price || 0,
          isPerfume: false,
          qty: 1
        };
      }
      refreshTotals();
    }

    function changeQty(key, delta) {
      if (!cart[key]) return;
      cart[key].qty += delta;
      if (cart[key].qty <= 0) delete cart[key];
      renderCartRows();
      refreshTotals();
    }

    // Промокод
    function applyPromoCode() {
      const inp = document.getElementById('promoInput');
      const alertBox = document.getElementById('promoAlert');
      const val = inp.value.trim().toUpperCase();

      const used = localStorage.getItem('promo_zlata_used');

      if (val === 'ZLATA') {
        if (used === 'true') {
          alertBox.textContent = '❌ Промокод Zlata уже использован ранее.';
          alertBox.style.color = 'var(--accent-red)';
          isPromoFree = false;
          activePromo = "";
        } else {
          isPromoFree = true;
          activePromo = "ZLATA";
          alertBox.textContent = '✅ Промокод ZLATA применён: бесплатная доставка!';
          alertBox.style.color = 'var(--primary)';
          inp.disabled = true;
        }
      } else {
        alertBox.textContent = '❌ Промокод не найден.';
        alertBox.style.color = 'var(--accent-red)';
        isPromoFree = false;
        activePromo = "";
      }
      refreshTotals();
    }

    function refreshTotals() {
      let subtotal = 0;
      let hasItems = false;

      for (const k in cart) {
        hasItems = true;
        subtotal += cart[k].price * cart[k].qty;
      }

      let delivery = (!hasItems) ? 0 : ((isPromoFree || subtotal >= 3000) ? 0 : 500);
      let total = subtotal + delivery;

      const footer = document.getElementById('cartFooter');
      if (hasItems) {
        footer.style.display = 'flex';
        document.getElementById('footerTotal').textContent = `${total} ₽`;
      } else {
        footer.style.display = 'none';
        closeCart();
      }

      document.getElementById('sumSubtotal').textContent = `${subtotal} ₽`;
      document.getElementById('sumDelivery').textContent = delivery === 0 ? '0 ₽ (Бесплатно)' : `${delivery} ₽`;
      document.getElementById('sumTotal').textContent = `${total} ₽`;
    }

    function openCart() {
      renderCartRows();
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function renderCartRows() {
      const cont = document.getElementById('cartItemsList');
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        cont.innerHTML = '<div style="padding:15px; text-align:center; color:#6b7280;">Корзина пуста</div>';
        return;
      }

      cont.innerHTML = keys.map(k => {
        const row = cart[k];
        const priceLabel = row.isPerfume ? 'стоимость уточнит менеджер' : `${row.price} ₽ × ${row.qty} шт.`;

        return `
          <div class="cart-row">
            <div>
              <div style="font-weight:600;">${row.title}</div>
              <div style="color:var(--text-muted); font-size:11px;">${priceLabel}</div>
            </div>
            <div class="qty-wrap">
              <button class="btn-circle" onclick="changeQty('${k}', -1)">−</button>
              <span>${row.qty}</span>
              <button class="btn-circle" onclick="changeQty('${k}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCustomRequest() {
      alert("Напишите боту в диалог название любого товара, который хотите заказать — менеджер свяжется с вами и добавит его в заказ!");
    }

    async function sendOrder(e) {
      e.preventDefault();

      const name = document.getElementById('uName').value.trim();
      const phone = document.getElementById('uPhone').value.trim();
      const addr = document.getElementById('uAddress').value.trim();

      let subtotal = 0;
      let itemsLines = [];

      for (const k in cart) {
        const row = cart[k];
        const sum = row.price * row.qty;
        subtotal += sum;
        if (row.isPerfume) {
          itemsLines.push(`${row.title} — ${row.qty} шт. (цена по запросу)`);
        } else {
          itemsLines.push(`${row.title} — ${row.qty} шт. (${sum} ₽)`);
        }
      }

      let delivery = (isPromoFree || subtotal >= 3000) ? 0 : 500;
      let total = subtotal + delivery;
      let promoLabel = activePromo || "нет";

      const orderMsg = 
`📦 НОВЫЙ ЗАКАЗ GREENWAY
👤 Клиент: ${name}
📞 Телефон: ${phone}
📍 Адрес: ${addr}
🎟 Промокод: ${promoLabel}

Состав заказа:
${itemsLines.join('\n')}

Сумма товаров: ${subtotal} ₽
